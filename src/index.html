<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1827" media="(prefers-color-scheme: dark)">
  <title>easyTimer</title>
  <link rel="icon" href="assets/branding/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/branding/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css?v=51">
</head>
<body data-duration-entry="presets-adjustments">
  <header>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <img class="brand-logo brand-logo-standard" src="assets/branding/stopwatch-header-standard-96.png" width="32" height="32" alt="">
        <img class="brand-logo brand-logo-dark" src="assets/branding/stopwatch-header-dark-96.png" width="32" height="32" alt="">
      </span>
      easyTimer
    </div>
  </header>
  <div id="preferences-menu" class="preferences-menu">
    <button id="menu-toggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="preferences" aria-label="Open preferences" title="Open preferences">
      <svg class="menu-icon menu-icon-open" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
      <svg class="menu-icon menu-icon-close" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="m6 6 12 12M18 6 6 18"/>
      </svg>
    </button>
    <div id="preferences" class="preferences" hidden>
      <span id="mode-heading" class="preference-heading" data-copy="mode">Mode</span>
      <div class="mode-choices" role="group" aria-labelledby="mode-heading">
        <button id="open-quick" class="mode-choice" type="button" aria-pressed="true">
          <svg class="navigation-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="14" r="8"/><path d="M12 6V3m-3-1h6m3 5 2-2m-8 5v4"/></svg>
          <span data-copy="quick">Quick Timer</span>
        </button>
        <button id="open-session" class="mode-choice" type="button" aria-pressed="false">
          <svg class="navigation-icon session-stopwatch" viewBox="0 0 32 26" aria-hidden="true" focusable="false">
            <g class="stopwatch-echo stopwatch-echo-far"><circle cx="24" cy="16" r="6.5"/><path d="M24 9.5V7m-2-1h4m3 5 1.5-1.5"/></g>
            <g class="stopwatch-echo stopwatch-echo-near"><circle cx="17" cy="16" r="7.25"/><path d="M17 8.75V6m-2-1h4m3 5 1.5-1.5"/></g>
            <circle class="stopwatch-face" cx="9" cy="16" r="8"/><path d="M9 8V4m-2-1h4m4 6 1.5-1.5M9 12v4"/>
          </svg>
          <span data-copy="session">Session Timer</span>
        </button>
      </div>
      <div class="planner-navigation">
        <button id="open-planner" type="button">
          <svg class="navigation-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4h10M4 8h5M4 12v8h16v-5m-12 1 1-4L19 2l3 3-10 10-4 1Zm9-12 3 3"/></svg>
          <span class="editor-copy"><span data-copy="planner">Session Editor</span><span class="editor-subtitle" data-copy="editorSubtitle">Create &amp; manage rundowns</span></span>
          <svg class="planner-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 6 6 6-6 6"/></svg>
        </button>
      </div>
      <button id="export-rundown" class="menu-export" type="button" hidden>
        <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/></svg>
        <span data-copy="exportRundown">Export Rundown</span>
      </button>
      <p id="export-feedback" class="menu-export-note" role="status" hidden></p>
      <div class="menu-settings">
      <div class="switch" role="group" data-label="language">
        <button type="button" data-language="de">DE</button>
        <button type="button" data-language="en">EN</button>
      </div>
      <div class="switch" role="group" data-label="theme">
        <button type="button" data-theme="light" aria-label="Light" title="Light">
          <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
        <button type="button" data-theme="dark" aria-label="Dark" title="Dark">
          <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20.5 15.1A8.5 8.5 0 0 1 8.9 3.5 8.5 8.5 0 1 0 20.5 15.1Z"/>
          </svg>
        </button>
        <button type="button" data-theme="system" aria-label="System" title="System">
          <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>
          </svg>
        </button>
      </div>
      </div>
    </div>
  </div>
  <div class="presentation-brand" aria-hidden="true">
    <span class="presentation-brand-mark">
      <img class="presentation-brand-logo brand-logo-standard" src="assets/branding/stopwatch-header-standard-96.png" width="22" height="22" alt="">
      <img class="presentation-brand-logo brand-logo-dark" src="assets/branding/stopwatch-header-dark-96.png" width="22" height="22" alt="">
    </span>
    <span>easyTimer</span>
  </div>
  <section id="runtime-recovery" class="runtime-recovery" aria-labelledby="recovery-heading" hidden>
    <h2 id="recovery-heading"></h2>
    <p id="recovery-feedback" role="status" tabindex="-1"></p>
    <div id="recovery-choices" hidden>
      <label id="recovery-label" for="recovery-select"></label>
      <select id="recovery-select" aria-describedby="recovery-detail"></select>
      <p id="recovery-detail"></p>
      <button id="recovery-restore" type="button"></button>
      <button id="recovery-dismiss" type="button"></button>
    </div>
  </section>
  <main aria-busy="true">
    <section class="timer" aria-labelledby="heading" style="visibility:hidden" id="timer-view">
      <h1 id="heading" data-copy="countdown">Countdown</h1>
      <button id="fullscreen" class="fullscreen-button" type="button" aria-pressed="false" aria-label="Fullscreen" title="Fullscreen">
        <svg class="fullscreen-icon fullscreen-icon-enter" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M8 3H3v5M16 3h5v5M8 21H3v-5m13 5h5v-5"/>
        </svg>
        <svg class="fullscreen-icon fullscreen-icon-exit" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M8 3v5H3m13-5v5h5M8 21v-5H3m13 5v-5h5"/>
        </svg>
      </button>
      <div id="session-context" class="session-context" hidden>
        <p id="workshop-name"></p>
        <h2 id="current-phase" aria-live="polite"></h2>
        <p id="phase-number"></p>
      </div>
      <div class="timer-stage">
      <div class="clock-face">
      <div id="time" role="timer" aria-live="off"></div>
      <button id="clock-view-toggle" class="clock-view-toggle" type="button" aria-label="Show clock-only view" hidden></button>
      </div>
      <p id="status" role="status"></p>
      </div>
      <div class="controls-region">
      <section class="duration-config" aria-labelledby="duration-heading">
        <h2 id="duration-heading" data-copy="duration">Duration</h2>
        <div class="duration-presets">
          <button type="button" data-preset="60000">1 min</button>
          <button type="button" data-preset="120000">2 min</button>
          <button type="button" data-preset="180000">3 min</button>
          <button type="button" data-preset="300000">5 min</button>
          <button type="button" data-preset="600000">10 min</button>
          <button type="button" data-preset="900000">15 min</button>
          <button type="button" data-preset="1800000">30 min</button>
          <button type="button" data-preset="3600000">60 min</button>
        </div>
      </section>
      <div class="control-bar">
      <div class="actions">
        <button id="primary" class="primary" type="button"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path id="primary-icon" d="m8 4 12 8-12 8Z"/></svg><span id="primary-label" class="action-label">Start</span></button>
        <button id="stop" type="button" hidden><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v14H5Z"/></svg><span class="action-label" data-copy="stop">Stop</span></button>
        <button id="stop-overtime" type="button" hidden><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v14H5Z"/></svg><span class="action-label" data-copy="stopOvertime">Stop overtime</span></button>
      </div>
      <section class="duration-adjustments" aria-labelledby="adjustment-heading">
        <h2 id="adjustment-heading">Add to duration</h2>
        <div class="adjustment-buttons">
          <button type="button" data-adjustment="3600000"><span class="amount-full">+1 h</span><span class="amount-compact" aria-hidden="true">+1h</span></button>
          <button type="button" data-adjustment="300000"><span class="amount-full">+5 min</span><span class="amount-compact" aria-hidden="true">+5m</span></button>
          <button type="button" data-adjustment="60000"><span class="amount-full">+1 min</span><span class="amount-compact" aria-hidden="true">+1m</span></button>
          <button type="button" data-adjustment="30000"><span class="amount-full">+30 s</span><span class="amount-compact" aria-hidden="true">+30s</span></button>
        </div>
      </section>
      </div>
      </div>
      <p id="help" role="status"></p>
    </section>
    <section id="session-picker" class="session-picker" aria-labelledby="session-picker-heading" hidden>
      <h1 id="session-picker-heading" tabindex="-1" data-copy="chooseWorkshop">Load Rundown</h1>
      <p class="picker-context" data-copy="pickerContext">Choose a saved rundown for the Session Timer.</p>
      <label class="picker-label" for="session-template" data-copy="workshopTemplate">Rundown</label>
      <select id="session-template" aria-describedby="session-picker-note"></select>
      <p id="session-feedback" role="status"></p>
      <p id="session-picker-note" data-copy="runNote">Saved sequences stay unchanged.</p>
      <div class="planner-actions">
        <button id="prepare-session" class="primary" type="button" data-copy="prepare" disabled>Load</button>
        <button id="reload-templates" type="button" data-copy="reloadTemplates">Refresh list</button>
      </div>
      <button id="create-rundown" class="picker-create" type="button">
        <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4h10M4 8h5M4 12v8h16v-5m-12 1 1-4L19 2l3 3-10 10-4 1Zm9-12 3 3"/></svg>
        <span class="editor-copy"><span data-copy="createRundown">Open Session Editor</span><span class="editor-subtitle" data-copy="pickerEditorSubtitle">Create &amp; edit rundowns</span></span>
      </button>
      <p id="session-reload-note" data-copy="pageReloadNote">Reloading this page discards the current run.</p>
      <button id="picker-back" class="picker-back" type="button">
        <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
        <span data-copy="backQuick">Back to Quick Timer</span>
      </button>
    </section>
    <section id="planner" class="planner" aria-label="Session Editor" hidden></section>
  </main>
  <div class="bottom-dock">
    <div class="dock-info">
    <p id="time-budget" class="time-budget">Total 05:00</p>
    <button id="next" class="next-phase" type="button" hidden>
      <span class="next-phase-copy"><span id="next-label">Up next</span><span id="next-phase"></span></span>
      <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path id="next-icon" d="M4 12h16m-6-6 6 6-6 6"/></svg>
    </button>
    <div id="automatic-preview" class="automatic-preview" hidden>
      <span id="automatic-next-label"></span>
      <span id="automatic-next-phase"></span>
    </div>
    </div>
    <div id="progress" class="progress-strip" aria-hidden="true"><span class="progress-marker"></span></div>
  </div>
  <footer>Crafted with <span class="footer-heart" role="img" aria-label="love">&#x2665;&#xFE0E;</span> by <a href="https://rolandseper.at" target="_blank" rel="noopener noreferrer">Roland B. Seper</a> | <a href="https://rbsnet.at" target="_blank" rel="noopener noreferrer">rbsnet.at</a> © 2026</footer>
  <noscript>This timer requires JavaScript. / Dieser Timer benötigt JavaScript.</noscript>
  <script type="module" src="js/app.js?v=51"></script>
</body>
</html>
