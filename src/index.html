<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>easyTimer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="vscode-shell">
        <div class="titlebar">
            <div class="titlebar-left">
                <span class="titlebar-icon">🧭</span>
                <span class="titlebar-text">RBS' easyTimer</span>
            </div>
            <div class="titlebar-actions">
                <button id="menuToggleBtn" class="icon-btn menu-toggle" type="button" aria-expanded="false" aria-label="Open menu">☰</button>
            </div>
        </div>

        <div id="appMenuOverlay" class="app-menu-overlay hidden" aria-hidden="true">
            <div class="app-menu-panel" role="dialog" aria-modal="true" aria-label="Application menu">
                <div class="app-menu-header">
                    <button type="button" class="theme-btn" data-theme="light" aria-label="Light theme">☀️</button>
                    <button type="button" class="theme-btn" data-theme="dark" aria-label="Dark theme">🌙</button>
                    <button type="button" class="theme-btn" data-theme="system" aria-label="System default theme">💻</button>
                </div>
                <div class="menu-section">
                    <div class="menu-label">Timer mode</div>
                    <label class="menu-option"><input type="radio" name="timerMode" value="countdown" checked> Normal countdown</label>
                    <label class="menu-option"><input type="radio" name="timerMode" value="sessions"> Session mode</label>
                </div>
                <div class="menu-section">
                    <button id="editSessionsBtn" type="button" class="secondary">Edit sessions</button>
                </div>
            </div>
        </div>

        <div id="sessionEditorOverlay" class="session-overlay hidden" aria-hidden="true">
            <div class="session-panel" role="dialog" aria-modal="true" aria-label="Session editor">
                <div class="session-panel-heading">
                    <div>
                        <h3>Session rundown</h3>
                        <p>Define titles and durations for your workshop sessions.</p>
                    </div>
                    <button id="closeSessionEditor" type="button" class="icon-btn" aria-label="Close session editor">✕</button>
                </div>
                <div class="session-list" id="sessionList"></div>
                <button id="addSessionBtn" type="button" class="primary">+ Add session</button>
                <div class="session-panel-actions">
                    <button id="saveSessionsBtn" type="button" class="primary">Save</button>
                    <button id="cancelSessionsBtn" type="button" class="secondary">Cancel</button>
                </div>
            </div>
        </div>

        <main class="editor-panel">
            <section class="timer-card" aria-labelledby="timer-heading">
                    <div class="timer-header">
                        <div>
                            <!-- Heading moved into the timer display for centered placement -->
                        </div>
                        <div class="timer-header-actions">
                            <div class="status-badge" id="timerStatus">Ready</div>
                            <button id="fullscreenBtn" class="icon-btn" aria-label="Enter fullscreen">⛶</button>
                        </div>
                    </div>
                    <div class="timer-display">
                        <h2 id="timer-heading">Countdown</h2>
                        <button id="closeFullscreenBtn" class="close-fullscreen hidden" aria-label="Exit fullscreen">✕</button>
                        <span id="time" aria-live="polite">00:00</span>
                    </div>
                    <div class="session-summary hidden" id="sessionSummary">
                        <span id="sessionTotalLabel">Total remaining</span>
                        <span id="sessionTotalTime">00:00</span>
                    </div>

                <button id="toggleControlsBtn" class="toggle-controls" type="button" aria-expanded="false">
                    Controls <span class="toggle-icon">▾</span>
                </button>

                <div class="timer-inputs">
                    <label class="timer-input">
                        <input id="hoursInput" type="number" min="0" max="99" value="0" inputmode="numeric" placeholder="0" aria-label="Hours" />
                        <span class="input-unit">h</span>
                    </label>
                    <label class="timer-input">
                        <input id="minutesInput" type="number" min="0" max="59" value="05" inputmode="numeric" placeholder="00" aria-label="Minutes" />
                        <span class="input-unit">m</span>
                    </label>
                    <label class="timer-input">
                        <input id="secondsInput" type="number" min="0" max="59" value="00" inputmode="numeric" placeholder="00" aria-label="Seconds" />
                        <span class="input-unit">s</span>
                    </label>
                </div>

                <div class="preset-bar">
                    <button type="button" class="preset-btn" data-seconds="60">1</button>
                    <button type="button" class="preset-btn" data-seconds="180">3</button>
                    <button type="button" class="preset-btn" data-seconds="300">5</button>
                    <button type="button" class="preset-btn" data-seconds="600">10</button>
                    <button type="button" class="preset-btn" data-seconds="900">15</button>
                    <button type="button" class="preset-btn" data-seconds="1800">30</button>
                    <button type="button" class="preset-btn" data-seconds="3600">60</button>
                </div>

                <div class="timer-controls">
                    <button id="startBtn" class="primary">Start</button>
                    <button id="pauseBtn" class="secondary">Pause</button>
                    <button id="restartSessionBtn" class="secondary hidden">Restart session</button>
                    <button id="nextSessionBtn" class="secondary hidden">Next session</button>
                    <button id="resetBtn" class="secondary">Stop & Reset</button>
                </div>
            </section>
        </main>

        <footer class="status-bar">
            Crafted with 🖤 by <a href="https://rolandseper.at" target="_new" rel="noopener noreferrer">&nbsp; Roland B. SEPER &nbsp;</a> © 2026
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
