<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>easyTimer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="brand">
            <h1>easyTimer</h1>
            <p>Einfacher Countdown für Workshops und Meetings</p>
        </div>
    </header>
    <main>
        <section class="timer-card" aria-labelledby="timer-heading">
            <div class="timer-header">
                <div>
                    <h2 id="timer-heading">Countdown</h2>
                    <p class="timer-note">Gib eine Dauer ein und starte den Timer.</p>
                </div>
                <div class="status-badge" id="timerStatus">Bereit</div>
            </div>

            <div class="timer-display" aria-live="polite" id="time">00:00</div>

            <div class="timer-inputs">
                <label>
                    Minuten
                    <input id="minutesInput" type="number" min="0" max="99" value="05" inputmode="numeric" />
                </label>
                <label>
                    Sekunden
                    <input id="secondsInput" type="number" min="0" max="59" value="00" inputmode="numeric" />
                </label>
            </div>

            <div class="timer-controls">
                <button id="startBtn" class="primary">Start</button>
                <button id="pauseBtn" class="secondary">Pause</button>
                <button id="resetBtn" class="secondary">Reset</button>
            </div>
        </section>
    </main>
    <footer>
        <p>Powered by easyTimer</p>
    </footer>

    <script>
        const timeDisplay = document.getElementById('time');
        const statusBadge = document.getElementById('timerStatus');
        const minutesInput = document.getElementById('minutesInput');
        const secondsInput = document.getElementById('secondsInput');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');

        let timerInterval;
        let remainingSeconds = 0;
        let running = false;

        function formatTime(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
        }

        function setRemainingFromInput() {
            const minutes = Math.max(0, Math.min(99, Number(minutesInput.value) || 0));
            const seconds = Math.max(0, Math.min(59, Number(secondsInput.value) || 0));
            remainingSeconds = minutes * 60 + seconds;
            timeDisplay.textContent = formatTime(remainingSeconds);
        }

        function updateButtonStates() {
            startBtn.disabled = running;
            pauseBtn.disabled = !running;
            resetBtn.disabled = !running && remainingSeconds === 0;
        }

        function updateStatus(text) {
            statusBadge.textContent = text;
        }

        function tick() {
            if (remainingSeconds <= 0) {
                stopTimer('Fertig!');
                return;
            }
            remainingSeconds -= 1;
            timeDisplay.textContent = formatTime(remainingSeconds);
            if (remainingSeconds === 0) {
                stopTimer('Fertig!');
            }
        }

        function startTimer() {
            if (running) return;
            if (remainingSeconds === 0) {
                setRemainingFromInput();
            }
            if (remainingSeconds === 0) {
                updateStatus('Bitte Dauer eingeben');
                return;
            }
            running = true;
            updateStatus('Läuft');
            updateButtonStates();
            timerInterval = setInterval(tick, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            running = false;
            updateStatus('Pausiert');
            updateButtonStates();
        }

        function resetTimer() {
            clearInterval(timerInterval);
            running = false;
            setRemainingFromInput();
            updateStatus('Bereit');
            updateButtonStates();
        }

        function stopTimer(message) {
            clearInterval(timerInterval);
            running = false;
            updateStatus(message);
            updateButtonStates();
        }

        minutesInput.addEventListener('input', () => {
            if (!running) {
                setRemainingFromInput();
            }
        });

        secondsInput.addEventListener('input', () => {
            if (!running) {
                setRemainingFromInput();
            }
        });

        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);

        setRemainingFromInput();
        updateButtonStates();
    </script>
</body>
</html>
