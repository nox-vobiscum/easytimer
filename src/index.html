<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>easyTimer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="vscode-shell">
        <div class="titlebar">
            <div class="titlebar-left">
                <span class="titlebar-icon">🧭</span>
                <span class="titlebar-text">RBS' easyTimer</span>
            </div>
        </div>

        <main class="editor-panel">
            <section class="timer-card" aria-labelledby="timer-heading">
                    <div class="timer-header">
                        <div>
                            <h2 id="timer-heading">Countdown</h2>
                        </div>
                        <div class="timer-header-actions">
                            <div class="status-badge" id="timerStatus">Ready</div>
                            <button id="fullscreenBtn" class="icon-btn" aria-label="Enter fullscreen">⛶</button>
                            <button id="closeFullscreenBtn" class="close-fullscreen hidden" aria-label="Exit fullscreen">✕</button>
                        </div>
                    </div>
                    <div class="timer-display" aria-live="polite" id="time">00:00</div>

                <button id="toggleControlsBtn" class="toggle-controls" type="button" aria-expanded="false">
                    Controls <span class="toggle-icon">▾</span>
                </button>

                <div class="timer-inputs">
                    <label class="timer-input">
                        <input id="hoursInput" type="number" min="0" max="99" value="0" inputmode="numeric" placeholder="0" aria-label="Hours" />
                        <span class="input-unit">h</span>
                    </label>
                    <label class="timer-input">
                        <input id="minutesInput" type="number" min="0" max="59" value="05" inputmode="numeric" placeholder="00" aria-label="Minutes" />
                        <span class="input-unit">m</span>
                    </label>
                    <label class="timer-input">
                        <input id="secondsInput" type="number" min="0" max="59" value="00" inputmode="numeric" placeholder="00" aria-label="Seconds" />
                        <span class="input-unit">s</span>
                    </label>
                </div>

                <div class="preset-bar">
                    <button type="button" class="preset-btn" data-seconds="60">1 min</button>
                    <button type="button" class="preset-btn" data-seconds="180">3 min</button>
                    <button type="button" class="preset-btn" data-seconds="300">5 min</button>
                    <button type="button" class="preset-btn" data-seconds="600">10 min</button>
                    <button type="button" class="preset-btn" data-seconds="900">15 min</button>
                    <button type="button" class="preset-btn" data-seconds="1800">30 min</button>
                    <button type="button" class="preset-btn" data-seconds="3600">60 min</button>
                </div>

                <div class="timer-controls">
                    <button id="startBtn" class="primary">Start</button>
                    <button id="pauseBtn" class="secondary">Pause</button>
                    <button id="resetBtn" class="secondary">Stop & Reset</button>
                </div>
            </section>
        </main>

        <footer class="status-bar">
            Crafted with ❤️ by Roland B. SEPER © 2026
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
