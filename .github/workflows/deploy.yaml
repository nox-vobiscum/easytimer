name: Deploy staging (et.rbsnet.at)
on:
  push:
    branches: [ develop ]

permissions:
  contents: read

concurrency:
  group: easytimer-staging
  cancel-in-progress: false

jobs:
  staging-deploy:
    name: Deploy staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://et.rbsnet.at/
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: Prepare allowlisted production artifact
      run: node tools/release/package.mjs --output "$RUNNER_TEMP/easytimer-release"

    - name: Check packaging safeguards
      run: node --test tests/packaging.test.mjs

    - name: Verify production artifact
      run: node tools/release/package.mjs --verify "$RUNNER_TEMP/easytimer-release"

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.STAGING_FTP_SERVER }}
        username: ${{ secrets.STAGING_FTP_USERNAME }}
        password: ${{ secrets.STAGING_FTP_PASSWORD }}
        # Preserve the existing src/... paths within the dedicated staging account.
        # Confirm its root and domain DocumentRoot before enabling deployment.
        local-dir: ${{ runner.temp }}/easytimer-release/ftp/
        server-dir: /
        port: 21
        protocol: ftps
        security: strict
        dangerous-clean-slate: false
        # Retain default exclusions and protect previously uploaded development
        # files from implicit cleanup. Remote inventory/removal needs approval.
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          docs/**
          tests/**
          tools/**
          .vscode/**
          README.md
          src/stopwatch.svg
